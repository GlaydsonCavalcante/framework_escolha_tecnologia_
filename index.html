<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador Estratégico • Automação & IA</title>
  
  <!-- Configurações PWA / Mobile Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Decisão IA">
  <meta name="theme-color" content="#ffffff" id="metaThemeColor">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fontes Corporativas: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            corp: {
              navy: '#0B1A3A',
              slate: '#1E293B',
              accent: '#1D4ED8',
              gold: '#B45309',
              goldLight: '#FEF3C7',
              emerald: '#059669',
              rose: '#DC2626'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Otimizações de Toque e Impressão */
    * { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @media print {
      body { background: #ffffff !important; color: #0f172a !important; }
      .no-print { display: none !important; }
      .print-box { border: 1px solid #cbd5e1 !important; box-shadow: none !important; background: #ffffff !important; color: #0f172a !important; }
      .print-text-dark { color: #0f172a !important; }
      .print-subtext { color: #475569 !important; }
    }
    
    @keyframes pulseGlow {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
      50% { stroke-dashoffset: -16; opacity: 1; }
    }
    .flow-line-active {
      stroke-dasharray: 6 6;
      animation: pulseGlow 3s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- Header Executivo Responsivo -->
  <header class="border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md sticky top-0 z-50 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2.5 sm:space-x-3">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-corp-navy text-white flex items-center justify-center font-bold text-sm sm:text-base shadow-sm flex-shrink-0">
          <span>AI</span>
        </div>
        <div class="truncate">
          <span class="text-[9px] sm:text-[10px] uppercase font-bold tracking-widest text-corp-gold dark:text-amber-400 font-display block leading-none">Diretriz Executiva • C-Level</span>
          <h1 class="text-xs sm:text-base font-bold text-slate-900 dark:text-white tracking-tight truncate">Decisão Estratégica em Automação</h1>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 sm:space-x-3 flex-shrink-0">
        <!-- Toggle Tema -->
        <button onclick="toggleTheme()" id="themeBtn" aria-label="Alternar Tema" class="p-2 sm:px-3 sm:py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-medium">
          <svg id="themeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
          <span id="themeLabel" class="hidden sm:inline">Modo Escuro</span>
        </button>
        <!-- Reiniciar -->
        <button onclick="resetFlow()" aria-label="Reiniciar" class="p-2 sm:px-3 sm:py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-1.5 text-xs font-medium">
          <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span class="hidden sm:inline">Reiniciar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navegador de Passos Responsivo (Horizontal Scroll no Mobile, Grid no Desktop) -->
  <section class="border-b border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/40 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-2.5 sm:py-4">
      <div class="flex items-center justify-between text-[11px] sm:text-xs mb-2 text-slate-600 dark:text-slate-400">
        <span class="font-display font-semibold tracking-wider uppercase text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-corp-gold animate-pulse"></span>
          Árvore de Decisão
        </span>
        <span id="completionRate" class="font-mono font-bold text-slate-700 dark:text-slate-300">25%</span>
      </div>

      <!-- Container com rolagem horizontal fluida no mobile -->
      <div id="treeContainer" class="flex md:grid md:grid-cols-4 gap-2 sm:gap-4 overflow-x-auto no-scrollbar pb-1 md:pb-0">
        <!-- Renderizado dinamicamente -->
      </div>
    </div>
  </section>

  <!-- Conteúdo Central -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 py-5 sm:py-10 flex flex-col justify-start sm:justify-center">

    <!-- Card de Pergunta Ativa -->
    <section id="questionCard" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl sm:rounded-2xl p-5 sm:p-8 shadow-sm dark:shadow-2xl relative overflow-hidden transition-all duration-200">
      <div id="questionInner"></div>
    </section>

    <!-- Dashboard Executivo de Resultados -->
    <section id="resultCard" class="hidden space-y-4 sm:space-y-6"></section>
  </main>

  <!-- Rodapé Corporativo -->
  <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 py-4 sm:py-5 text-center text-[11px] sm:text-xs text-slate-500 no-print mt-auto">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-1.5 sm:gap-2">
      <p>Critério de suficiência técnica • Alinhamento estratégico e orçamentário</p>
      <span>Governança & Soberania Digital</span>
    </div>
  </footer>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const isDark = savedTheme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      updateThemeUI(isDark);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
      renderDecisionTree();
    }

    function updateThemeUI(isDark) {
      document.getElementById('themeLabel').textContent = isDark ? 'Modo Claro' : 'Modo Escuro';
      document.getElementById('metaThemeColor').setAttribute('content', isDark ? '#020617' : '#ffffff');
    }

    const appState = {
      step: 1,
      answers: { 1: null, 2: null, 3: null, 4: null },
      verdictType: null
    };

    const workflowNodes = [
      { id: 1, label: "Maturidade", sub: "Padronização" },
      { id: 2, label: "Sistemas", sub: "Ambiente & Regras" },
      { id: 3, label: "Atividade", sub: "Mover vs Interpretar" },
      { id: 4, label: "Contratação", sub: "Sigilo & Custo" }
    ];

    const questions = {
      1: {
        stepNumber: 1,
        stepTag: "Filtro 1 • Maturidade do Processo",
        title: "O processo que você deseja melhorar já possui um passo a passo claro, padronizado e documentado?",
        contextReason: "Automatizar um processo desordenado amplifica falhas em alta velocidade, incorrendo em despesas de licenças sem ganho real de produtividade.",
        options: [
          {
            key: "NAO",
            badge: "Não Padronizado",
            badgeType: "warn",
            title: "Não, o processo possui variações informais ou retrabalho",
            desc: "A rotina depende de decisões individuais, inexiste documentação formal ou ocorrem desvios manuais frequentes.",
            leadsTo: "exit_1"
          },
          {
            key: "SIM",
            badge: "Padronizado",
            badgeType: "success",
            title: "Sim, o processo é estruturado e estável",
            desc: "As etapas são documentadas, os critérios decisórios são explícitos e o fluxo opera de forma previsível.",
            leadsTo: 2
          }
        ]
      },
      2: {
        stepNumber: 2,
        stepTag: "Filtro 2 • Ambiente Sistêmico",
        title: "Essa atividade acontece dentro de um único software e exige apenas validações numéricas ou cálculos fixos?",
        contextReason: "Evita alocação excessiva de capital. Recursos nativos do próprio software resolvem a demanda sem necessidade de robôs ou IA externa.",
        options: [
          {
            key: "SIM",
            badge: "Sistema Único",
            badgeType: "warn",
            title: "Sim, opera em um único sistema sob regras matemáticas fixas",
            desc: "A rotina transcorre inteiramente em um único ERP, CRM ou sistema legado, aplicando apenas limites ou cálculos objetivos.",
            leadsTo: "exit_2"
          },
          {
            key: "NAO",
            badge: "Múltiplos Sistemas",
            badgeType: "success",
            title: "Não, cruza sistemas diferentes ou manipula documentos",
            desc: "Exige trânsito de dados entre múltiplas aplicações, documentos externos ou leitura interpretativa.",
            leadsTo: 3
          }
        ]
      },
      3: {
        stepNumber: 3,
        stepTag: "Passo 2 • Capacidade Tecnológica Requerida",
        title: "Qual é o principal esforço executado pela equipe nesse gargalo?",
        contextReason: "Define se o gargalo requer execução mecânica de dados, interpretação semântica de textos ou orquestração integrada completa.",
        options: [
          {
            key: "A",
            badge: "Transferência de Dados",
            badgeType: "neutral",
            title: "Opção A: Copiar, validar e transferir dados entre sistemas sob regras fixas",
            desc: "Direcionamento: Automação Robótica de Processos (RPA). Execução estruturada de tarefas repetitivas.",
            leadsTo: 4
          },
          {
            key: "B",
            badge: "Interpretação e Análise",
            badgeType: "neutral",
            title: "Opção B: Ler textos, analisar documentos densos, resumir relatórios ou emitir pareceres",
            desc: "Direcionamento: Inteligência Artificial Analítica e Generativa. Interpretação textual e suporte à decisão.",
            leadsTo: 4
          },
          {
            key: "C",
            badge: "Processo Ponta a Ponta",
            badgeType: "neutral",
            title: "Opção C: Receber documentos não estruturados, analisar o conteúdo e lançar nos sistemas",
            desc: "Direcionamento: Sistemas Integrados de Automação e IA (Multiagentes). Compreensão documental acoplada à execução transacional.",
            leadsTo: 4
          }
        ]
      },
      4: {
        stepNumber: 4,
        stepTag: "Passo 3 • Governança, Sigilo e Modelo de Contratação",
        title: "Qual é o nível de sigilo das informações e a importância estratégica desse fluxo?",
        contextReason: "Equilibra o formato de contratação (in-house, plataforma assistida ou software de mercado) frente a CAPEX, OPEX e soberania dos dados.",
        options: [
          {
            key: "A",
            badge: "Soberania Máxima",
            badgeType: "gold",
            title: "Opção A: Processo central do negócio (Core Business) ou sigilo regulatório/bancário estrito",
            desc: "Recomendação: Desenvolvimento Interno Proprietário. Equipes técnicas enxutas com apoio de IA e infraestrutura privada.",
            leadsTo: "result"
          },
          {
            key: "B",
            badge: "Autonomia Departamental",
            badgeType: "gold",
            title: "Opção B: Processo de área de apoio (RH, Finanças, Operações) com demanda por agilidade",
            desc: "Recomendação: Plataformas de Baixo Código (Low-Code) integradas a APIs de IA sob governança da TI.",
            leadsTo: "result"
          },
          {
            key: "C",
            badge: "Software de Mercado",
            badgeType: "gold",
            title: "Opção C: Rotina administrativa padrão de mercado ou necessidade de teste rápido (PoC)",
            desc: "Recomendação: Software Pronto como Serviço (SaaS) com custo 100% em despesa operacional (OPEX).",
            leadsTo: "result"
          }
        ]
      }
    };

    function renderDecisionTree() {
      const container = document.getElementById('treeContainer');
      const rateLabel = document.getElementById('completionRate');

      let completedSteps = appState.verdictType ? 4 : appState.step - 1;
      rateLabel.textContent = `${Math.min(100, Math.round((completedSteps / 4) * 100))}%`;

      container.innerHTML = workflowNodes.map(node => {
        const isCurrent = appState.step === node.id && !appState.verdictType;
        const answer = appState.answers[node.id];
        const isAnswered = answer !== null;

        let statusClass = "border-slate-200 dark:border-slate-800 bg-slate-100/50 dark:bg-slate-900/40 text-slate-400 opacity-60";
        let dotClass = "bg-slate-300 dark:bg-slate-700";

        if (isCurrent) {
          statusClass = "border-corp-accent dark:border-blue-500 bg-blue-50/50 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm ring-1 ring-blue-500/20";
          dotClass = "bg-corp-accent animate-pulse";
        } else if (isAnswered) {
          statusClass = "border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 hover:border-corp-gold cursor-pointer shadow-sm";
          dotClass = "bg-corp-gold";
        }

        let answerSummary = "Pendente";
        if (node.id === 1 && answer) answerSummary = answer === 'SIM' ? 'Padronizado' : 'Não Padronizado';
        if (node.id === 2 && answer) answerSummary = answer === 'SIM' ? 'Sistema Único' : 'Múltiplos Sistemas';
        if (node.id === 3 && answer) {
          if (answer === 'A') answerSummary = 'Mover Dados';
          if (answer === 'B') answerSummary = 'Interpretar';
          if (answer === 'C') answerSummary = 'Ponta a Ponta';
        }
        if (node.id === 4 && answer) {
          if (answer === 'A') answerSummary = 'Próprio';
          if (answer === 'B') answerSummary = 'Low-Code';
          if (answer === 'C') answerSummary = 'SaaS';
        }

        return `
          <div onclick="${isAnswered ? `jumpToStep(${node.id})` : ''}"
               class="min-w-[135px] sm:min-w-0 p-2.5 sm:p-3 rounded-lg sm:rounded-xl border transition-all text-left ${statusClass} flex flex-col justify-between flex-shrink-0 md:flex-shrink">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[9px] sm:text-[10px] font-mono uppercase text-slate-500 dark:text-slate-400">0${node.id}</span>
              <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full ${dotClass}"></span>
            </div>
            <div>
              <div class="text-[11px] sm:text-xs font-semibold font-display truncate">${node.label}</div>
              <div class="text-[10px] sm:text-[11px] truncate text-corp-gold dark:text-amber-400 font-medium">${isAnswered ? answerSummary : node.sub}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderQuestion(stepNumber) {
      appState.step = stepNumber;
      appState.verdictType = null;

      const q = questions[stepNumber];
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');
      const inner = document.getElementById('questionInner');

      card.classList.remove('hidden');
      resultCard.classList.add('hidden');

      renderDecisionTree();

      inner.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-3">
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] sm:text-[11px] font-bold uppercase tracking-wider bg-blue-50 dark:bg-blue-950/60 text-corp-accent dark:text-blue-400 border border-blue-200 dark:border-blue-800 font-display">
            <span class="w-1.5 h-1.5 rounded-full bg-corp-accent dark:bg-blue-400"></span>
            ${q.stepTag}
          </span>
          
          ${stepNumber > 1 ? `
            <button onclick="previousStep()" class="text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-1 font-medium active:scale-95">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
              <span>Voltar</span>
            </button>
          ` : ''}
        </div>

        <h2 class="text-base sm:text-2xl font-bold text-slate-900 dark:text-white font-display tracking-tight leading-snug mb-2 sm:mb-3">
          ${q.title}
        </h2>

        <div class="p-3 sm:p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 mb-4 sm:mb-6 text-xs text-slate-700 dark:text-slate-300 flex items-start gap-2">
          <div class="p-1 rounded bg-amber-100 dark:bg-amber-950/60 text-corp-gold dark:text-amber-400 mt-0.5 flex-shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0A2.25 2.25 0 109.75 10.5h4.5A2.25 2.25 0 0012 12.75zm0-7.5h.008v.008H12V5.25z"/></svg>
          </div>
          <div>
            <span class="font-bold text-corp-gold dark:text-amber-400 uppercase tracking-wider block text-[9px] sm:text-[10px]">Impacto Estratégico:</span>
            <p class="text-slate-600 dark:text-slate-400 mt-0.5 leading-relaxed text-[11px] sm:text-xs">${q.contextReason}</p>
          </div>
        </div>

        <div class="grid grid-cols-1 ${q.options.length === 2 ? 'sm:grid-cols-2' : 'gap-2.5 sm:gap-3'} gap-2.5 sm:gap-3">
          ${q.options.map(opt => `
            <button onclick="selectOption(${stepNumber}, '${opt.key}', '${opt.leadsTo}')"
                    class="group text-left p-3.5 sm:p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/80 hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-blue-400 dark:hover:border-blue-500 active:scale-[0.99] transition-all flex flex-col justify-between shadow-sm">
              <div>
                <div class="flex items-center justify-between mb-1.5 sm:mb-2">
                  <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded font-display ${getBadgeStyle(opt.badgeType)}">
                    ${opt.badge}
                  </span>
                  <svg class="w-4 h-4 text-slate-400 group-hover:text-corp-accent dark:group-hover:text-blue-400 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                  </svg>
                </div>
                <h3 class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-slate-100 group-hover:text-corp-accent dark:group-hover:text-blue-400 mb-1 leading-snug">${opt.title}</h3>
                <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-relaxed font-light">${opt.desc}</p>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function getBadgeStyle(type) {
      if (type === 'warn') return 'bg-rose-100 dark:bg-rose-950/80 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
      if (type === 'success') return 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
      if (type === 'gold') return 'bg-amber-100 dark:bg-amber-950/80 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800';
      return 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700';
    }

    function selectOption(stepNumber, key, leadsTo) {
      appState.answers[stepNumber] = key;
      for (let s = stepNumber + 1; s <= 4; s++) {
        appState.answers[s] = null;
      }

      if (leadsTo === 'exit_1') {
        appState.verdictType = 'q1_exit';
        renderDiagnostics();
      } else if (leadsTo === 'exit_2') {
        appState.verdictType = 'q2_exit';
        renderDiagnostics();
      } else if (leadsTo === 'result') {
        appState.verdictType = 'completed';
        renderDiagnostics();
      } else {
        renderQuestion(parseInt(leadsTo));
      }
    }

    function previousStep() {
      if (appState.step > 1) {
        renderQuestion(appState.step - 1);
      }
    }

    function jumpToStep(targetStep) {
      renderQuestion(targetStep);
    }

    function resetFlow() {
      appState.step = 1;
      appState.answers = { 1: null, 2: null, 3: null, 4: null };
      appState.verdictType = null;
      renderQuestion(1);
    }

    function renderDiagnostics() {
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');

      card.classList.add('hidden');
      resultCard.classList.remove('hidden');

      renderDecisionTree();

      let data = {};

      if (appState.verdictType === 'q1_exit') {
        data = {
          badge: "Filtro 1 • Requisito de Maturidade",
          badgeColor: "bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300 border-rose-300 dark:border-rose-800",

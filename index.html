<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framework Estratégico de Decisão para Automação Inteligente</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            corp: {
              navy: '#1e3a8a',
              navyDark: '#0f172a',
              gold: '#b45309',
              goldLight: '#fef3c7',
              goldDark: '#78350f',
              blueSoft: '#eff6ff',
              slateLight: '#f8fafc',
            }
          }
        }
      }
    }
  </script>

  <style>
    @media print {
      body { background-color: #ffffff !important; color: #0f172a !important; }
      .no-print { display: none !important; }
      .print-border { border: 1px solid #cbd5e1 !important; box-shadow: none !important; background: #ffffff !important; }
      .print-text { color: #0f172a !important; }
      .print-subtext { color: #475569 !important; }
      .print-page-break { page-break-before: always; }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.8; }
      50% { stroke-dashoffset: -20; opacity: 1; }
    }
    .flow-connector {
      stroke-dasharray: 6 6;
      animation: pulseGlow 3.5s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- Executive Header -->
  <header class="border-b border-slate-200 bg-white/95 dark:border-slate-800 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 transition-colors duration-200 no-print">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand & Title -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-900 dark:bg-slate-800 border border-blue-800 dark:border-slate-700 flex items-center justify-center text-amber-500 shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0118 16.5h-2.25m-7.5 0h7.5m-7.5 0l-1 3m8.5-3l1 3m0 0l.5 1.5m-.5-1.5h-9.5m0 0l-.5 1.5M9 11.25v1.5M12 9v3.75m3-6v6"/>
          </svg>
        </div>
        <div>
          <span class="text-[10px] uppercase font-bold tracking-widest text-amber-700 dark:text-amber-400 font-display block leading-none">C-Level Decision Framework</span>
          <h1 class="text-sm sm:text-base font-bold text-slate-900 dark:text-white tracking-tight">Decisão Estratégica em Automação & IA</h1>
        </div>
      </div>

      <!-- Header Actions: Theme Switcher & Reset -->
      <div class="flex items-center space-x-2">
        <button id="themeToggleBtn" onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
          <span id="themeIcon">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
          </span>
          <span id="themeLabel" class="hidden sm:inline">Modo Escuro</span>
        </button>

        <button onclick="resetDiagnostic()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-1.5 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          <span class="hidden sm:inline">Reiniciar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Interactive Decision Graph / Timeline Blueprint (Visual Tree) -->
  <section class="border-b border-slate-200 bg-slate-100/70 dark:border-slate-800/80 dark:bg-slate-900/40 no-print transition-colors">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between text-xs mb-3">
        <span class="font-display font-bold tracking-wider uppercase text-slate-600 dark:text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-700 dark:bg-amber-400"></span>
          Árvore Dinâmica de Decisão (Clique em uma etapa concluída para alterar)
        </span>
        <span id="completionRate" class="font-mono font-bold text-blue-900 dark:text-slate-300">25%</span>
      </div>

      <!-- Node Timeline Flow -->
      <div id="treeContainer" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </section>

  <!-- Main Canvas Container -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 py-8 sm:py-10 flex flex-col justify-center">

    <!-- Active Question Card -->
    <section id="questionCard" class="bg-white border border-slate-200/90 dark:bg-slate-900/90 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm dark:shadow-2xl relative overflow-hidden transition-all duration-300">
      <div id="questionInner"></div>
    </section>

    <!-- Comprehensive Executive Diagnostics Dashboard (Rendered upon conclusion) -->
    <section id="resultCard" class="hidden space-y-6"></section>

  </main>

  <!-- Executive Institutional Footer -->
  <footer class="border-t border-slate-200 bg-white dark:border-slate-900 dark:bg-slate-950 py-5 text-center text-xs text-slate-500 transition-colors no-print">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>Estrutura baseada em eficiência de capital e governança corporativa auditável (BCG, Gartner, McKinsey).</p>
      <span class="font-semibold text-slate-600 dark:text-slate-400">Alocação Estratégica & Soberania de Dados</span>
    </div>
  </footer>

  <script>
    // State Machine
    const appState = {
      step: 1, // 1, 2, 3, 4, or 'result'
      answers: {
        1: null,
        2: null,
        3: null,
        4: null
      },
      verdictType: null // 'q1_exit', 'q2_exit', or 'completed'
    };

    // Diagnostic Stages
    const workflowNodes = [
      { id: 1, label: "Maturidade", sub: "Fluxo de Trabalho" },
      { id: 2, label: "Sistemas", sub: "Abrangência de TI" },
      { id: 3, label: "Atividade", sub: "Gargalo Operacional" },
      { id: 4, label: "Governança", sub: "Sigilo & Contratação" }
    ];

    // Corporate Questions Model (Zero Jargon)
    const questions = {
      1: {
        stepNumber: 1,
        stepTag: "Filtro 1 • Maturidade do Fluxo de Trabalho",
        title: "O processo que você deseja aprimorar já possui etapas claras, padronizadas e mapeadas?",
        contextReason: "Automatizar um processo caótico apenas amplifica falhas em maior velocidade. Sem padronização prévia, qualquer investimento em licenças de software se converte em custos contínuos de retrabalho e manutenção técnica.",
        options: [
          {
            key: "NAO",
            badge: "Fluxo Imaturo",
            badgeType: "warn",
            title: "Não, o processo possui variações informais ou retrabalho",
            desc: "Ainda há indefinições de alçadas, exceções não documentadas ou dependência do conhecimento tácito dos operadores.",
            leadsTo: "exit_1"
          },
          {
            key: "SIM",
            badge: "Processo Estruturado",
            badgeType: "success",
            title: "Sim, o processo é documentado, estável e previsível",
            desc: "As etapas são claras, os desvios conhecidos e a execução opera de maneira padronizada pela equipe.",
            leadsTo: 2
          }
        ]
      },
      2: {
        stepNumber: 2,
        stepTag: "Filtro 2 • Abrangência dos Sistemas",
        title: "A tarefa ocorre dentro de um único software e exige apenas validações matemáticas ou cálculos fixos?",
        contextReason: "Protege o orçamento contra investimentos redundantes. Se as regras podem ser resolvidas dentro do ERP ou CRM que a empresa já paga, contratar ferramentas adicionais gera desperdício orçamentário.",
        options: [
          {
            key: "SIM",
            badge: "Software Único",
            badgeType: "warn",
            title: "Sim, opera em um único sistema sob regras ou cálculos fixos",
            desc: "A rotina ocorre inteiramente em um único ERP, CRM ou sistema legado com validações puramente numéricas ou de limites de alçada.",
            leadsTo: "exit_2"
          },
          {
            key: "NAO",
            badge: "Múltiplos Sistemas / Dinâmico",
            badgeType: "success",
            title: "Não, cruza diferentes sistemas ou dados não estruturados",
            desc: "Exige trânsito de dados entre múltiplas aplicações, documentos externos, e-mails ou análise de informações variadas.",
            leadsTo: 3
          }
        ]
      },
      3: {
        stepNumber: 3,
        stepTag: "Filtro 3 • Tipo de Trabalho no Gargalo",
        title: "Qual é o principal esforço exigido da sua equipe nesse gargalo operacional?",
        contextReason: "Identifica a tecnologia correta com base no menor custo e menor complexidade viável. Evita usar Inteligência Artificial cara para tarefas que robôs simples resolvem com 100% de precisão matemática.",
        options: [
          {
            key: "A",
            badge: "Transferência de Dados",
            badgeType: "neutral",
            title: "Opção A: Copiar, preencher e transferir dados tabulares entre sistemas sob regras fixas",
            desc: "Direcionamento: Automação de Tarefas Repetitivas (RPA). Execução determinística de rotinas mecânicas sem necessidade de interpretação.",
            leadsTo: 4
          },
          {
            key: "B",
            badge: "Análise Cognitiva",
            badgeType: "neutral",
            title: "Opção B: Ler documentos, resumir relatórios, analisar textos e apoiar decisões técnicas",
            desc: "Direcionamento: Inteligência Artificial Analítica e Generativa (IA). Compreensão de textos livres, sumarização e análise sob critérios dinâmicos.",
            leadsTo: 4
          },
          {
            key: "C",
            badge: "Fluxo Completo Integrado",
            badgeType: "neutral",
            title: "Opção C: Processo Completo: Interpretar documentos livres e executar lançamentos sistêmicos",
            desc: "Direcionamento: Sistemas Integrados de Automação e IA (Multiagentes). Solução de ponta a ponta: agentes cognitivos compreendem a solicitação e acionam a execução direta nos sistemas.",
            leadsTo: 4
          }
        ]
      },
      4: {
        stepNumber: 4,
        stepTag: "Filtro 4 • Sigilo dos Dados e Modelo de Contratação",
        title: "Quais são a criticidade estratégica e a sensibilidade dos dados desse fluxo?",
        contextReason: "Alinha a contratação ao perfil financeiro da empresa (CAPEX vs OPEX) e define a blindagem de governança necessária para impedir o vazamento de segredos corporativos para nuvens públicas.",
        options: [
          {
            key: "A",
            badge: "Soberania Máxima",
            badgeType: "gold",
            title: "Opção A: Missão crítica corporativa (Core Business) ou sigilo bancário/regulatório estrito",
            desc: "Recomendação: Desenvolvimento Interno Proprietário (In-House / Soberania Máxima via Equipes Enxutas e Modelos Privados).",
            leadsTo: "result"
          },
          {
            key: "B",
            badge: "Autonomia Departamental",
            badgeType: "gold",
            title: "Opção B: Processo departamental relevante (RH, Operações, Suporte) com autonomia das áreas",
            desc: "Recomendação: Automação Departamental Assistida (Plataformas Low-Code integradas a IA corporativa com Governança da TI).",
            leadsTo: "result"
          },
          {
            key: "C",
            badge: "Validação Rápida / Apoio",
            badgeType: "gold",
            title: "Opção C: Rotina de apoio padronizada de mercado ou validação de projeto-piloto sem time interno",
            desc: "Recomendação: Software de Mercado como Serviço (SaaS Terceirizado / 100% OPEX sem investimento inicial em equipe).",
            leadsTo: "result"
          }
        ]
      }
    };

    // Render Dynamic Decision Tree
    function renderDecisionTree() {
      const container = document.getElementById('treeContainer');
      const rateLabel = document.getElementById('completionRate');

      let completedSteps = 0;
      if (appState.verdictType) {
        completedSteps = 4;
      } else {
        completedSteps = appState.step - 1;
      }
      rateLabel.textContent = `${Math.min(100, Math.round((completedSteps / 4) * 100))}%`;

      container.innerHTML = workflowNodes.map(node => {
        const isCurrent = appState.step === node.id && !appState.verdictType;
        const answer = appState.answers[node.id];
        const isAnswered = answer !== null;

        let statusClass = "border-slate-200 bg-white text-slate-400 dark:border-slate-800 dark:bg-slate-900/40 dark:text-slate-500 opacity-70";
        let dotClass = "bg-slate-300 dark:bg-slate-700";

        if (isCurrent) {
          statusClass = "border-blue-600 bg-blue-50/70 text-blue-900 shadow-md ring-1 ring-blue-500/30 dark:border-blue-500 dark:bg-slate-800 dark:text-white";
          dotClass = "bg-blue-600 dark:bg-blue-400 animate-pulse";
        } else if (isAnswered) {
          statusClass = "border-slate-300 bg-white text-slate-700 hover:border-amber-600 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 cursor-pointer shadow-sm";
          dotClass = "bg-amber-600 dark:bg-amber-400";
        }

        let answerSummary = "Pendente";
        if (node.id === 1 && answer) answerSummary = answer === 'SIM' ? 'Padronizado' : 'Imaturo (Ajustar)';
        if (node.id === 2 && answer) answerSummary = answer === 'SIM' ? 'Software Único' : 'Múltiplos Sistemas';
        if (node.id === 3 && answer) {
          if (answer === 'A') answerSummary = 'RPA (Tarefas)';
          if (answer === 'B') answerSummary = 'IA (Cognitiva)';
          if (answer === 'C') answerSummary = 'Multiagente (Misto)';
        }
        if (node.id === 4 && answer) {
          if (answer === 'A') answerSummary = 'In-House Próprio';
          if (answer === 'B') answerSummary = 'Low-Code Assistido';
          if (answer === 'C') answerSummary = 'Software SaaS';
        }

        return `
          <div onclick="${isAnswered ? `jumpToStep(${node.id})` : ''}"
               class="p-3 rounded-xl border transition-all duration-200 text-left ${statusClass} flex flex-col justify-between">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-mono tracking-wider uppercase font-semibold text-slate-500 dark:text-slate-400">Etapa 0${node.id}</span>
              <span class="w-2 h-2 rounded-full ${dotClass}"></span>
            </div>
            <div>
              <div class="text-xs font-bold font-display text-slate-900 dark:text-white">${node.label}</div>
              <div class="text-[11px] truncate text-amber-700 dark:text-amber-400 font-medium">${isAnswered ? answerSummary : node.sub}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render Question Canvas
    function renderQuestion(stepNumber) {
      appState.step = stepNumber;
      appState.verdictType = null;

      const q = questions[stepNumber];
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');
      const inner = document.getElementById('questionInner');

      card.classList.remove('hidden');
      resultCard.classList.add('hidden');

      renderDecisionTree();

      inner.innerHTML = `
        <!-- Stage Tag and Navigation -->
        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-[11px] font-bold uppercase tracking-wider bg-blue-100 text-blue-900 dark:bg-blue-950 dark:text-blue-300 border border-blue-200 dark:border-blue-800 font-display">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-600 dark:bg-blue-400"></span>
            ${q.stepTag}
          </span>
          
          <div class="flex items-center space-x-2">
            ${stepNumber > 1 ? `
              <button onclick="previousStep()" class="text-xs px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1.5 font-medium">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
                Voltar à etapa anterior
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Question Title -->
        <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white font-display tracking-tight leading-snug mb-3">
          ${q.title}
        </h2>

        <!-- Executive Strategic Impact Callout -->
        <div class="p-4 rounded-xl bg-slate-100 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 mb-6 text-xs flex items-start gap-3">
          <div class="p-1 rounded bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-400 mt-0.5 flex-shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0A2.25 2.25 0 109.75 10.5h4.5A2.25 2.25 0 0012 12.75zm0-7.5h.008v.008H12V5.25z"/></svg>
          </div>
          <div>
            <span class="font-bold text-amber-800 dark:text-amber-400 uppercase tracking-wider block text-[10px]">Impacto Estratégico para a Liderança:</span>
            <p class="text-slate-600 dark:text-slate-400 mt-0.5 leading-relaxed">${q.contextReason}</p>
          </div>
        </div>

        <!-- Options Buttons -->
        <div class="grid grid-cols-1 ${q.options.length === 2 ? 'sm:grid-cols-2' : 'gap-3'} gap-3">
          ${q.options.map(opt => `
            <button onclick="selectOption(${stepNumber}, '${opt.key}', '${opt.leadsTo}')"
                    class="group text-left p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/70 hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-blue-600 dark:hover:border-blue-400 transition-all duration-200 flex flex-col justify-between shadow-sm hover:shadow-md">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded font-display ${getBadgeStyle(opt.badgeType)}">
                    ${opt.badge}
                  </span>
                  <svg class="w-4 h-4 text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                  </svg>
                </div>
                <h3 class="text-sm font-bold text-slate-900 dark:text-slate-100 group-hover:text-blue-900 dark:group-hover:text-white mb-1.5 leading-snug">${opt.title}</h3>
                <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-normal">${opt.desc}</p>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function getBadgeStyle(type) {
      if (type === 'warn') return 'bg-rose-100 text-rose-800 border border-rose-300 dark:bg-rose-950/80 dark:text-rose-300 dark:border-rose-800/60';
      if (type === 'success') return 'bg-emerald-100 text-emerald-800 border border-emerald-300 dark:bg-emerald-950/80 dark:text-emerald-300 dark:border-emerald-800/60';
      if (type === 'gold') return 'bg-amber-100 text-amber-900 border border-amber-300 dark:bg-amber-950/80 dark:text-amber-400 dark:border-amber-800/60';
      return 'bg-slate-100 text-slate-700 border border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700';
    }

    // Step Transition Handlers
    function selectOption(stepNumber, key, leadsTo) {
      appState.answers[stepNumber] = key;

      for (let s = stepNumber + 1; s <= 4; s++) {
        appState.answers[s] = null;
      }

      if (leadsTo === 'exit_1') {
        appState.verdictType = 'q1_exit';
        renderDiagnostics();
      } else if (leadsTo === 'exit_2') {
        appState.verdictType = 'q2_exit';
        renderDiagnostics();
      } else if (leadsTo === 'result') {
        appState.verdictType = 'completed';
        renderDiagnostics();
      } else {
        renderQuestion(parseInt(leadsTo));
      }
    }

    function previousStep() {
      if (appState.step > 1) {
        renderQuestion(appState.step - 1);
      }
    }

    function jumpToStep(targetStep) {
      renderQuestion(targetStep);
    }

    function resetDiagnostic() {
      appState.step = 1;
      appState.answers = { 1: null, 2: null, 3: null, 4: null };
      appState.verdictType = null;
      renderQuestion(1);
    }

    // Diagnostics Engine (Clean Corporate Language)
    function renderDiagnostics() {
      const card = document.getElementById('questionCard');
      const resultCard = document.getElementById('resultCard');

      card.classList.add('hidden');
      resultCard.classList.remove('hidden');

      renderDecisionTree();

      let data = {};

      if (appState.verdictType === 'q1_exit') {
        data = {
          badge: "Filtro de Eficiência: Processo Sem Padronização",
          badgeColor: "bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-950/80 dark:text-rose-300 dark:border-rose-800",
          title: "Redesenho e Padronização Prévia de Processos (Sem Tecnologia Imediata)",

            <span class="text-[10px] text-slate-500 font-mono">Governança Prática</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5">
            ${data.phases.map((ph, idx) => `
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-900 dark:bg-slate-800 dark:text-amber-400 flex items-center justify-center font-bold text-xs">${idx + 1}</span>
                    <span class="text-[9px] font-mono text-slate-500 uppercase tracking-widest">Fase 0${idx + 1}</span>
                  </div>
                  <h4 class="text-xs font-bold text-slate-900 dark:text-white mb-1.5">${ph.title}</h4>
                  <p class="text-xs text-slate-600 dark:text-slate-400 font-normal leading-relaxed">${ph.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Immediate Strategic Action Plan Checklist -->
        <div class="p-6 rounded-2xl bg-white border border-slate-200 dark:bg-slate-900/70 dark:border-slate-800 shadow-sm print-border">
          <h3 class="text-xs font-bold uppercase tracking-widest text-slate-800 dark:text-slate-200 font-display mb-3 flex items-center gap-2">
            <span class="w-2 h-2 rounded bg-emerald-600"></span>
            Checklist de Próximos Passos Imediatos para a Liderança
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${data.nextSteps.map((step, idx) => `
              <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 flex items-start gap-2.5">
                <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-amber-400 flex items-center justify-center font-bold text-[10px] flex-shrink-0">${idx + 1}</span>
                <span class="leading-relaxed font-normal">${step}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Theme Switcher Logic (Corporate Light as Default)
    function applyTheme(isDark) {
      const htmlEl = document.documentElement;
      const themeLabel = document.getElementById('themeLabel');
      const themeIcon = document.getElementById('themeIcon');

      if (isDark) {
        htmlEl.classList.add('dark');
        themeLabel.textContent = "Modo Claro";
        themeIcon.innerHTML = `
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
          </svg>
        `;
      } else {
        htmlEl.classList.remove('dark');
        themeLabel.textContent = "Modo Escuro";
        themeIcon.innerHTML = `
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
          </svg>
        `;
      }
    }

    function toggleTheme() {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      const newThemeDark = !isCurrentlyDark;
      localStorage.setItem('corp_theme_pref', newThemeDark ? 'dark' : 'light');
      applyTheme(newThemeDark);
    }

    // App Initialization
    window.addEventListener('DOMContentLoaded', () => {
      // Check stored preference, default to corporate Light
      const savedTheme = localStorage.getItem('corp_theme_pref');
      if (savedTheme === 'dark') {
        applyTheme(true);
      } else {
        applyTheme(false); // Default: Light Mode
      }

      renderQuestion(1);
    });
  </script>
</body>
</html>
